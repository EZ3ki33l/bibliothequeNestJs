services:
  db:
    image: postgres:16-alpine
    container_name: bibliotheque-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant}
    volumes:
      - bibliotheque_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - internal
      - db-access

  migrate:
    container_name: bibliotheque-migrate
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  api:
    container_name: bibliotheque-api
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN manquant}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL manquant}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET manquant}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      QUIZ_LLM_API_KEY: ${QUIZ_LLM_API_KEY:-}
      QUIZ_LLM_BASE_URL: ${QUIZ_LLM_BASE_URL:-}
      QUIZ_LLM_MODEL: ${QUIZ_LLM_MODEL:-}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
      - proxy

  web:
    container_name: bibliotheque-web
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL manquant}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:80"
    depends_on:
      - api
    networks:
      - internal
      - proxy

volumes:
  bibliotheque_postgres_data:
    name: bibliotheque_postgres_data

networks:
  internal:
    name: bibliotheque_internal
    internal: true

  db-access:
    name: bibliotheque_db_access

  proxy:
    name: docker_proxy
    external: true
