server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/wasm;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Spec 017, moteur Python : demandé par la page de la fiche (même origine,
    # donc ni CORS ni en-tête particulier). Le chemin porte la version, le
    # cache peut durer un an : une mise à jour change le chemin.
    location /pyodide/ {
        # Types des cinq fichiers, écrits ici : le mime.types de nginx 1.27 ne
        # connaît pas .mjs (servi en octet-stream, donc jamais compressé).
        types {
            text/javascript js mjs;
            application/wasm wasm;
            application/zip zip;
            application/json json;
        }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Spec 017, document de l'atelier Python. Il est chargé dans une iframe
    # sandbox="allow-scripts" : origine opaque, sans cookie ni accès à la page.
    # connect-src 'none' coupe tout le réseau, y compris pour le worker blob:
    # qui hérite de cette politique : le moteur arrive par postMessage.
    # Dans nginx, un add_header ici remplace ceux des niveaux supérieurs : la
    # CSP de la SPA (location /) ne s'y applique pas, celle-ci est plus stricte.
    location /python-runner/ {
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src blob:; connect-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        # Spec 016, défense en profondeur : le navigateur refuse toute image,
        # police ou feuille de style qui ne vient pas du site ou de son API.
        # Le rendu d'une fiche bloque déjà les images externes ; cette ligne
        # les bloque aussi si une régression les laissait passer. Rien d'autre
        # n'est restreint (pas de default-src) : scripts, connexions et iframes
        # de Sandpack ne sont pas concernés. __API_ORIGIN__ est remplacé au
        # build du conteneur (Dockerfile, étape web).
        add_header Content-Security-Policy "img-src 'self' data: blob: __API_ORIGIN__; font-src 'self' data:; style-src 'self' 'unsafe-inline'" always;
    }
}
